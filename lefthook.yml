pre-commit:
  parallel: true
  commands:
    biome:
      glob: "packages/**/*.{ts,js,astro,json}"
      run: bunx @biomejs/biome@2 check --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    staged-tests:
      glob: "packages/astropress/{src,tests,web-components}/**/*.ts"
      run: bun run test:staged

    audit-arch:
      glob: "packages/**/*.ts"
      run: bun run audit:arch

    stryker-contamination:
      # Defense-in-depth: Stryker's inPlace:true has been removed from all
      # configs, but this catches any leaks (stryMutAct_*, stryCov_*,
      # @ts-nocheck headers, bin/ file-mode drops) that slip into staged
      # diffs. Runs on every commit; cost is negligible (~50ms).
      run: bun run tooling/scripts/check-stryker-contamination.ts

    # Previous monolithic ci-audits block ran all 37 audits serially on any
    # packages/**/*.ts change (~48s). Split into ~30 parallel commands, each
    # with a narrow glob so most commits fire only 3–5 audits. Slow whole-repo
    # audits (deps:graph, tooling-types, docs:api:check, docs:check) moved to
    # pre-push where they're amortized across a batch.

    audit-deps:
      glob: ["package.json", "bun.lock", "packages/*/package.json"]
      run: bun run audit:deps

    check-version:
      glob: "packages/astropress/package.json"
      run: bun run check:version

    audit-arch-rust:
      glob: "crates/**/*.rs"
      run: bun run audit:arch:rust

    # Catch TypeScript errors in tooling/ scripts at commit time, not at
    # pre-push (where they used to live, costing devs the entire pre-push
    # wall-clock to discover a trivial type error). Scoped to tooling/**/*.ts
    # so unrelated edits don't trigger it.
    audit-tooling-types:
      glob: "tooling/**/*.ts"
      run: bun run audit:tooling-types

    audit-codeql-patterns:
      glob: "packages/**/*.{ts,astro}"
      run: bun run audit:codeql-patterns

    audit-security:
      glob: "packages/astropress/{src,pages,components}/**/*.{ts,astro}"
      run: bun run audit:security

    audit-suppressions:
      glob: "packages/**/*.{ts,astro}"
      run: bun run audit:suppressions

    audit-integration-secrets-schema-parity:
      glob: "packages/astropress/src/sqlite-runtime/integrations*.ts"
      run: bun run audit:integration-secrets-schema-parity

    audit-honesty:
      glob: ["packages/**/*.{ts,astro,md}", "README.md", "AGENTS.md", "CHANGELOG.md"]
      run: bun run audit:honesty

    audit-microcopy:
      glob: "packages/**/*.{ts,astro}"
      run: bun run audit:microcopy

    audit-test-fanout:
      glob: "packages/**/*.test.ts"
      run: bun run audit:test-fanout

    audit-aeo:
      glob:
        - "packages/astropress/components/*Aeo*.astro"
        - "packages/astropress/components/*Seo*.astro"
        - "packages/astropress/components/AstropressContentLayout.astro"
        - "packages/astropress/src/aeo-metadata.ts"
        - "packages/astropress/src/sitemap*.ts"
        - "packages/astropress/public/llms.txt"
        - "packages/astropress/components/DonateAction.astro"
      run: bun run audit:aeo

    audit-providers:
      glob: ["AGENTS.md", "tooling/verified-providers.json", "packages/astropress/src/provider*.ts"]
      run: bun run audit:providers

    audit-cli-docs:
      glob: ["crates/**/*.rs", "crates/**/*.toml", "docs/**/*.md"]
      run: bun run audit:cli-docs

    audit-doc-links:
      glob: ["README.md", "CONTRIBUTING.md", "docs/**/*.md"]
      run: bun run audit:doc-links

    audit-env-contract:
      glob: "packages/astropress/src/**/*.ts"
      run: bun run audit:env-contract

    audit-exports:
      glob: ["packages/astropress/src/adapters/**", "packages/astropress/tests/**/*.test.ts"]
      run: bun run audit:exports

    audit-crypto:
      glob: "packages/astropress/src/**/*.ts"
      run: bun run audit:crypto

    audit-js-ts-shadow:
      glob: "packages/astropress/pages/**/*.{js,ts,astro}"
      run: bun run audit:js-ts-shadow

    audit-dev-secret-fail-closed:
      glob: "packages/astropress/src/**/*.ts"
      run: bun run audit:dev-secret-fail-closed

    audit-runtime-dispatch-parity:
      glob: "packages/astropress/pages/**/*.{ts,astro}"
      run: bun run audit:runtime-dispatch-parity

    audit-security-header-envelope:
      glob: "packages/astropress/{src/api-middleware.ts,pages/**/*.ts}"
      run: bun run audit:security-header-envelope

    audit-api-inventory-parity:
      glob: "packages/astropress/{src/api-routes-data.ts,pages/ap-api/**/*.ts}"
      run: bun run audit:api-inventory-parity

    audit-secret-in-url:
      glob: "packages/astropress/pages/ap-admin/**/*.{ts,astro}"
      run: bun run audit:secret-in-url

    audit-forbidden-render-safety:
      glob: "packages/astropress/pages/ap-admin/**/*.astro"
      run: bun run audit:forbidden-render-safety

    audit-abac-enforcement-parity:
      glob: "packages/astropress/pages/ap-admin/**/*.{ts,astro}"
      run: bun run audit:abac-enforcement-parity

    audit-web-components:
      glob: ["packages/astropress/web-components/**/*.ts", "packages/astropress/index.ts"]
      run: bun run audit:web-components

    audit-navigation:
      glob:
        - "packages/astropress/public/admin.css"
        - "packages/astropress/web-components/admin-nav.ts"
        - "packages/astropress/src/admin-ui.ts"
        - "packages/astropress/pages/ap-admin/**"
        - "crates/astropress-cli/src/cli_config/**"
      run: bun run audit:navigation

    audit-interaction:
      glob:
        - "packages/astropress/public/admin.css"
        - "packages/astropress/web-components/**/*.ts"
        - "packages/astropress/pages/**"
        - "packages/astropress/components/**"
      run: bun run audit:interaction

    audit-error-handling:
      glob:
        - "packages/astropress/src/admin-action*.ts"
        - "packages/astropress/src/runtime-admin-actions*.ts"
        - "packages/astropress/src/deploy*.ts"
        - "packages/astropress/src/cache-purge*.ts"
      run: bun run audit:error-handling

    audit-caching:
      glob:
        - "packages/astropress/src/cache*.ts"
        - "packages/astropress/src/cloudflare-cache*.ts"
        - "packages/astropress/src/webhook*.ts"
        - "packages/astropress/src/security-headers.ts"
      run: bun run audit:caching

    audit-nexus:
      glob: "packages/astropress-nexus/**"
      run: bun run audit:nexus

    audit-developer-ergonomics:
      glob: ["README.md", "AGENTS.md", "packages/astropress/README.md", "crates/**/*.rs", "packages/astropress/src/scaffold/**"]
      run: bun run audit:developer-ergonomics

    audit-dead-exports:
      glob: ["packages/astropress/src/**/*.ts", "packages/astropress/index.ts"]
      run: bun run audit:dead-exports

    audit-bdd-wiring:
      glob:
        - "tooling/bdd/**/*.feature"
        - "packages/astropress/tests/**/*.test.ts"
        - "packages/astropress-nexus/tests/**/*.test.ts"
      run: bun run audit:bdd-wiring

    audit-no-stub-tests:
      glob: ["packages/**/tests/**/*.test.ts", "crates/**/*.rs"]
      run: bun run audit:no-stub-tests

    audit-evaluation-integrity:
      glob:
        - "docs/reference/EVALUATION.md"
        - "package.json"
        - ".github/workflows/ci.yml"
        - "tooling/scripts/audit-*.ts"
      run: bun run audit:evaluation-integrity

    audit-observability:
      glob: "packages/astropress/src/**/*.ts"
      run: bun run audit:observability

    audit-api-design:
      glob:
        - "packages/astropress/src/api-*.ts"
        - "packages/astropress/src/page-handlers/**"
        - "packages/astropress/pages/ap-api/**"
      run: bun run audit:api-design

    audit-ai-drivability:
      glob: ["AGENTS.md", "packages/astropress/**/llms.txt", "packages/astropress/src/**/*.ts"]
      run: bun run audit:ai-drivability

    audit-i18n:
      glob:
        - "packages/astropress/src/locale-links.ts"
        - "packages/astropress/src/admin-i18n.ts"
        - "packages/astropress/src/admin-locale-links.ts"
        - "packages/astropress/src/translation-state.ts"
        - "tooling/bdd/admin/i18n.feature"
      run: bun run audit:i18n

    audit-content-modeling:
      glob: ["packages/astropress/src/content-modeling.ts", "packages/astropress/src/platform-contracts.ts"]
      run: bun run audit:content-modeling

    audit-collaboration:
      glob:
        - "packages/astropress/src/content-locking*.ts"
        - "packages/astropress/src/d1-locking*.ts"
        - "packages/astropress/src/sqlite-locking*.ts"
        - "packages/astropress/web-components/lock*.ts"
      run: bun run audit:collaboration

    audit-oss-health:
      glob:
        - "LICENSE"
        - "CONTRIBUTING.md"
        - "CODE_OF_CONDUCT.md"
        - "SECURITY.md"
        - "CHANGELOG.md"
        - "README.md"
        - ".github/ISSUE_TEMPLATE/**"
      run: bun run audit:oss-health

    audit-scaffold-quality:
      glob:
        - "packages/astropress/src/scaffold/**"
        - "crates/astropress-cli/src/doctor*.rs"
        - "crates/astropress-cli/src/scaffold*.rs"
        - "packages/astropress/bin/**"
      run: bun run audit:scaffold-quality

    audit-playwright-projects:
      glob: ["tooling/e2e/playwright.config.ts", "package.json"]
      run: bun run audit:playwright-projects

    audit-registry-sync:
      glob:
        - "tooling/audit-registry.ts"
        - "tooling/playwright-registry.ts"
        - "tooling/scripts/audit-registry-sync.ts"
        - "package.json"
        - "lefthook.yml"
        - ".github/workflows/ci.yml"
        - "tooling/e2e/playwright.config.ts"
      run: bun run audit:registry-sync

    audit-mutation-scope:
      glob:
        - "packages/astropress/src/auth-*.ts"
        - "packages/astropress/src/security-*.ts"
        - "packages/astropress/src/runtime-admin-*.ts"
        - "tooling/stryker/stryker*.config.mjs"
      run: bun run audit:mutation-scope

    # DO NOT REMOVE — guards against silent erosion of the mutation-coverage
    # quality bar. If this trips, fix tests or refactor code; do not lower the
    # threshold. See tooling/scripts/audit-stryker-thresholds.ts header.
    audit-stryker-thresholds:
      glob: "tooling/stryker/stryker*.config.mjs"
      run: bun run tooling/scripts/audit-stryker-thresholds.ts

    # DO NOT REMOVE — partner to audit-stryker-thresholds. The thresholds audit
    # locks the BREAK percentage; this one locks the mutate-array scope so a
    # silently-added `!`-pattern can't quietly drop a file out of mutation
    # coverage. Every exclusion must be registered in ALLOWLIST in the audit
    # script with a rubric. See tooling/scripts/audit-stryker-exclusions.ts.
    audit-stryker-exclusions:
      glob:
        - "tooling/stryker/stryker*.mjs"
        - "packages/*/stryker*.mjs"
        - "tooling/scripts/audit-stryker-exclusions.ts"
      run: bun run audit:stryker-exclusions

    # DO NOT REMOVE — partner to audit-stryker-thresholds. The thresholds audit
    # locks the BREAK percentage in stryker config; this one locks the per-file
    # baseline-scores.json so a commit can't silently lower a floor (whether
    # by hand-edit or by an automated rebaseline that captured a methodology
    # drift as the new truth). See tooling/scripts/audit-baseline-floor.ts.
    audit-baseline-floor:
      glob: "tooling/stryker/baseline-scores.json"
      run: bun run tooling/scripts/audit-baseline-floor.ts

    # Same lock for the Rust cargo-mutants baseline.
    audit-baseline-floor-rust:
      glob: "tooling/cargo-mutants/baseline-scores.json"
      run: bun run tooling/scripts/audit-baseline-floor-rust.ts

    # Block dead admin label keys (defined in AdminLabelKey union but never
    # read) and dynamic label call sites (silent UI regression risk).
    audit-admin-labels:
      glob:
        - "packages/astropress/src/admin-labels.ts"
        - "packages/astropress/src/admin-ui.ts"
        - "packages/astropress/components/**/*.astro"
        - "packages/astropress/pages/**/*.{astro,ts}"
      run: bun run tooling/scripts/audit-admin-label-coverage.ts

    # Block admin route registry drift (entrypoint on disk not registered, or
    # registry entry without backing file).
    audit-admin-route-drift:
      glob:
        - "packages/astropress/pages/ap-admin/**/*.{astro,ts}"
        - "packages/astropress/src/admin-routes.ts"
      run: bun run tooling/scripts/audit-admin-route-drift.ts

    # Block any new admin route lacking a paired test mention with anon-auth
    # keyword. Combined with admin-routes-auth-matrix.test.ts this catches
    # routes that ship without a redirect-to-login regression check.
    audit-route-http-matrix:
      glob:
        - "packages/astropress/pages/ap-admin/**/*.{astro,ts}"
        - "packages/astropress/tests/**/*.ts"
      run: bun run tooling/scripts/audit-route-http-matrix.ts

    # Block any dynamic-segment admin route without an edge-input test.
    audit-dynamic-segments:
      glob:
        - "packages/astropress/pages/ap-admin/**/*.{astro,ts}"
        - "packages/astropress/tests/**/*.ts"
      run: bun run tooling/scripts/audit-dynamic-segments.ts

    # Auto-regenerate d1-schema.sql whenever sqlite-schema.sql changes, then
    # re-stage. The follow-up audit-schema-migration audit will fail loudly
    # if a hand-edit slipped past the regen.
    d1-schema-regen:
      glob: "packages/astropress/src/sqlite-schema.sql"
      run: |
        bun run tooling/scripts/generate-d1-schema.ts && \
          git add packages/astropress/src/d1-schema.sql

    # Gate D1 ↔ sqlite drift and the freshness of the generated d1-schema.sql.
    audit-schema-migration:
      glob:
        - "packages/astropress/src/sqlite-schema.sql"
        - "packages/astropress/src/d1-schema.sql"
        - "packages/astropress/src/d1-*.ts"
      run: bun run tooling/scripts/audit-schema-migration-robustness.ts

    # Block any future narrowing of vitest coverage.include that would drop
    # baseline-tracked src files out of v8 measurement (false confidence).
    audit-v8-coverage-scope:
      glob:
        - "packages/astropress/vitest.config.ts"
        - "tooling/stryker/baseline-scores.json"
      run: bun run tooling/scripts/audit-v8-coverage-scope.ts

    # Grandfather-ratchet on weak boundary types (Record<string, unknown>,
    # Result<T, String>, .unwrap(), etc.). Counts can shrink, never grow.
    audit-boundary-types:
      glob:
        - "packages/astropress/src/**/*.ts"
        - "crates/astropress-cli/src/**/*.rs"
        - "tooling/audit-output/boundary-types-baseline.json"
      run: bun run tooling/scripts/audit-boundary-types.ts

    # Per-file v8 coverage ratchet — lines/branches/functions for every
    # tracked src file may move up but never down. Seeded baseline lives at
    # tooling/audit-output/coverage-floor-baseline.json. After intentionally
    # raising tests, re-run `test:coverage` then
    # `audit-coverage-floor.ts --rewrite-baseline` to ratchet up.
    audit-coverage-floor:
      glob:
        - "packages/astropress/coverage/coverage-summary.json"
        - "tooling/audit-output/coverage-floor-baseline.json"
      run: bun run tooling/scripts/audit-coverage-floor.ts

    # Block any unresolved `audit-followup: <id>` markers from accumulating.
    # The convention pairs every deferred adjacent issue with a marker so it
    # stays visible in pre-push instead of decaying into invisible TODO sprawl.
    audit-followup-marker:
      run: bun run tooling/scripts/audit-followup-marker.ts

    # Grandfather-ratchet on src files lacking a *.test.ts companion (and
    # orphan tests with no src target). Counts can shrink, never grow.
    audit-source-test-pairing:
      glob:
        - "packages/astropress/src/**/*.ts"
        - "packages/astropress/tests/**/*.ts"
        - "crates/astropress-cli/src/**/*.rs"
        - "tooling/audit-output/source-test-pairing-baseline.json"
      run: bun run tooling/scripts/audit-source-test-pairing.ts

    # Auto-regenerate API_REFERENCE.md when an entry-point file changes,
    # then re-stage it. Keeps slow-audits' docs:api:check from being the
    # discovery point — it caused multiple wasted ~10-min pre-push cycles
    # before this hook existed. The generator is fast (~1s).
    docs-api-regen:
      glob:
        - "packages/astropress/index.ts"
        - "packages/astropress/src/config.ts"
        - "packages/astropress/src/platform-contracts.ts"
        - "packages/astropress/src/api-middleware.ts"
        - "packages/astropress/src/admin-ui.ts"
        - "packages/astropress/src/d1-migrate-ops.ts"
        - "packages/astropress/src/db-migrate-ops.ts"
        - "packages/astropress/src/sqlite-bootstrap.ts"
        - "packages/astropress/src/cache-purge.ts"
        - "packages/astropress/src/transactional-email.ts"
        - "packages/astropress/src/analytics.ts"
        - "packages/astropress/src/public-site-integration.ts"
      run: bun run docs:api && git add docs/reference/API_REFERENCE.md
      stage_fixed: true

    # Non-blocking warning: surfaces Stryker disable / v8 ignore / biome-ignore
    # / @ts-ignore comments so the author considers a code-level fix instead.
    audit-suppression-warnings:
      glob: "{packages,tooling}/**/*.{ts,tsx,js,mjs,cjs}"
      run: bun run tooling/scripts/audit-suppression-warnings.ts {staged_files}

    audit-ci-sarif-upload:
      glob: ".github/workflows/*.yml"
      run: bun run audit:ci-sarif-upload

    audit-nuclei-suppressions:
      glob: ".github/workflows/*.yml"
      run: bun run audit:nuclei-suppressions

    bdd-lint:
      glob: "tooling/bdd/**/*.feature"
      run: bun run bdd:lint

    rust-clippy:
      glob: "crates/**/*.rs"
      run: cargo clippy --offline -p astropress-cli --manifest-path crates/Cargo.toml -- -D warnings

    no-secrets:
      run: bash tooling/scripts/hooks/no-secrets.sh

    verify-signing:
      run: bash tooling/scripts/hooks/verify-signing.sh

commit-msg:
  commands:
    format:
      run: bash tooling/scripts/hooks/format.sh {1}

pre-push:
  parallel: true
  # lefthook 2.x doesn't support fail_fast on parallel groups, so we wrap
  # each command with run-with-peer-abort.ts which polls a sentinel file
  # keyed by parent PID. The first failing command writes the sentinel;
  # peers see it and SIGTERM their children. Sentinels live in /tmp so
  # they self-evaporate on reboot — no cleanup hook needed.
  commands:
    gates:
      run: bun run tooling/scripts/run-with-peer-abort.ts gates -- bun run tooling/scripts/run-with-timing.ts gates -- bun run test:prepush

    # DO NOT REMOVE OR RELAX — closes the gap the pre-commit threshold audit
    # leaves open. Runs Stryker mutation testing scoped to files changed on
    # this branch vs. origin/main, so the check is fast (≈ 60s) but still
    # blocks PRs whose new code scores below the 95% floor. See the script
    # header for the full rationale.
    mutation-gate:
      # LEFTHOOK_PUSH=1 lets the script detect it's running inside `git push`
      # so it can fail fast and print exact recovery commands instead of
      # rewriting baseline-scores.json mid-push (which would later trip
      # repo:clean and abort with a misleading dirty-worktree error).
      #
      # Wrapped in run-with-timing because lefthook's own duration display
      # uses parallel-queue start time, which under-reports long steps
      # (a 10-minute Stryker run can read as "0.26 seconds" when other steps
      # are running in parallel). The wrapper emits real wall-clock duration
      # to stderr at completion.
      env:
        LEFTHOOK_PUSH: "1"
      # mutation-gate populates baseline-scores.json for new src files as a
      # side effect; audit:baseline-coverage checks every src file has an
      # entry. Running both in parallel races: a push that adds new src
      # files + correctly populates them via the gate would still fail the
      # audit because audit checks before the gate writes. Sequence them
      # in one bash invocation so coverage runs against the just-updated
      # baseline.
      run: >-
        bun run tooling/scripts/run-with-peer-abort.ts mutation-gate --
        bun run tooling/scripts/run-with-timing.ts mutation-gate -- bash -c '
          bun run tooling/scripts/is-baseline-only-push.ts && exit 0;
          bun run tooling/scripts/prepush-mutation-gate.ts &&
          bun run audit:baseline-coverage &&
          bun run audit:baseline-coverage:rust
        '

    # Rust mutation gate runs in parallel with the TS gate above. Same
    # content-hash-aware delta model: only files changed since origin/main
    # are re-mutated; unchanged files reuse their baseline score. The
    # baseline floor (95% for new files; no regression on existing) is
    # enforced separately by audit:baseline-floor:rust in slow-audits.
    mutation-gate-rust:
      tags: rust mutation
      run: >-
        bun run tooling/scripts/run-with-peer-abort.ts mutation-gate-rust --
        bun run tooling/scripts/run-with-timing.ts mutation-gate-rust -- bash -c '
          bun run tooling/scripts/is-baseline-only-push.ts && exit 0;
          bun run tooling/scripts/prepush-mutation-gate-rust.ts
        '

    slow-audits:
      # Whole-repo static audits moved out of pre-commit because they scan far
      # beyond any changed file. Amortized across a push (not per-commit) these
      # add ~15–20s to pre-push wall-clock but nothing to pre-commit feedback.
      # audit:tooling-types and audit:baseline-coverage moved out:
      #   - audit:tooling-types runs in pre-commit (catches TS errors fast)
      #   - audit:baseline-coverage runs sequentially after mutation-gate
      #     above (avoids the new-file race).
      run: >-
        bun run tooling/scripts/run-with-peer-abort.ts slow-audits --
        bun run tooling/scripts/run-with-timing.ts slow-audits -- bash -c '
          bun run audit:deps:graph &&
          bun run audit:toolchain-pins &&
          bun run docs:api:check &&
          bun run docs:check &&
          bun run tooling/scripts/audit-astro-check.ts &&
          bun run tooling/scripts/run-discovery-audit.ts
        '

    verify-commits-signed:
      run: bash tooling/scripts/hooks/verify-commits-signed.sh

    sweep-tmp:
      # Reclaim /tmp + .stryker-tmp before pre-push gates fire — test runs
      # leave per-case tmpdirs and crashed Stryker runs leave sandbox dirs
      # under .stryker-tmp/. Anything untouched for an hour is from a prior
      # crashed run, safe to delete. Never kills running processes.
      run: |
        find /tmp -maxdepth 1 \( -name 'astropress-cli-*' -o -name 'astropress-*' \) \
          -mmin +60 -exec rm -rf {} + 2>/dev/null || true
        find .stryker-tmp -maxdepth 1 -mindepth 1 -type d -name 'sandbox-*' \
          -mmin +60 -exec rm -rf {} + 2>/dev/null || true
